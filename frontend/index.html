<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acarson DDL Orchestrator</title>
    <link rel="icon" href="https://watch.minirecc.com/web/favicon.bc8d51405ec040305a87.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <div class="auth-header">
                <img src="https://watch.minirecc.com/web/favicon.bc8d51405ec040305a87.ico" alt="Logo" class="auth-logo">
                <h1>Orchestrator</h1>
                <p>Enter your access key to continue.</p>
            </div>
            <form id="auth-form">
                <div class="input-group">
                    <input type="password" id="api-key" placeholder="Access Key" required>
                </div>
                <button type="submit" id="unlock-btn" class="btn-primary">
                    <span id="unlock-text">Unlock</span>
                    <div id="unlock-spinner" class="spinner-small hidden"></div>
                </button>
            </form>
            <div id="auth-status" class="status-text hidden"></div>
        </div>
    </div>

    <div id="app-screen" class="screen hidden">
        <header class="app-header">
            <div class="header-content">
                <div class="header-brand">
                    <img src="https://watch.minirecc.com/web/favicon.bc8d51405ec040305a87.ico" alt="Logo" class="header-logo">
                    <h1>Acarson DDL Orchestrator</h1>
                </div>
                <nav class="header-nav">
                    <button id="nav-search" class="nav-link active">Search</button>
                    <button id="nav-tasks" class="nav-link">Tasks</button>
                </nav>
                <button id="logout-btn" class="btn-secondary">Lock Session</button>
            </div>
        </header>

        <main class="container">
            <!-- Search View -->
            <div id="view-search" class="view active">
                <div class="search-section">
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Search anime on Jikan...">
                        <button id="search-btn" class="btn-primary">Search</button>
                    </div>
                </div>

                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p class="loading-text">Waking up server and fetching results...</p>
                </div>

                <div id="results-grid" class="grid"></div>
            </div>

            <!-- Tasks View -->
            <div id="view-tasks" class="view hidden">
                <div class="tasks-header">
                    <h2>Active & Recent Downloads</h2>
                    <p class="text-muted">Real-time status from JDownloader.</p>
                </div>
                
                <div id="tasks-loading" class="hidden">
                    <div class="spinner"></div>
                    <p class="loading-text">Fetching tasks from JDownloader...</p>
                </div>
                
                <div id="tasks-grid" class="tasks-grid"></div>
            </div>
        </main>
    </div>

    <div id="request-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 550px; width: 100%;">
            <h2 id="modal-title">Request Anime</h2>
            <p class="modal-subtitle">Configure provider settings for <strong id="modal-anime-name"></strong>.</p>
            
            <!-- STEP 1: Search Provider -->
            <div id="modal-step-1" class="modal-step">
                <div class="input-group">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="provider-select" class="provider-select" style="flex: 1; margin-bottom: 0;">
                            <option value="">Loading providers...</option>
                        </select>
                        <button id="refresh-providers-btn" class="icon-btn" title="Refresh Providers" style="padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path></svg>
                        </button>
                    </div>
                </div>
                
                <div class="input-group">
                    <select id="media-type-select" class="provider-select">
                        <option value="auto">Auto-Detect (Based on Title / Filenames)</option>
                        <option value="movie">Force Movie (Picks 1 Best Link Overall)</option>
                        <option value="tv">Force TV Show (Picks 1 Best Link Per Episode)</option>
                    </select>
                </div>
                
                <div class="modal-actions" style="display: flex; gap: 8px; margin-top: 20px;">
                    <button id="cancel-modal" class="btn-secondary" style="flex: 1;">Cancel</button>
                    <button id="find-matches-btn" class="btn-primary" disabled style="flex: 2;">
                        <span id="find-text">Find Matches</span>
                        <div id="find-spinner" class="spinner-small hidden"></div>
                    </button>
                </div>
            </div>
            
            <!-- STEP 2: Verify Results -->
            <div id="modal-step-2" class="modal-step hidden">
                <div id="matches-list" class="matches-list" style="max-height: 250px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
                </div>
                
                <div class="modal-actions" style="display: flex; gap: 8px; margin-top: 20px;">
                    <button id="back-to-step-1" class="btn-secondary" style="flex: 1;">Back</button>
                </div>
            </div>

            <!-- STEP 3: Extraction (Dry Run / Send) -->
            <div id="modal-step-3" class="modal-step hidden">
                <div class="selected-match-card" style="background: var(--bg-tertiary); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: left;">
                    <p class="text-muted" style="margin: 0 0 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Selected Match</p>
                    <div id="selected-match-display" style="font-weight: 500; font-size: 14px; color: var(--text-primary); word-break: break-all;"></div>
                </div>
                
                <div class="modal-actions" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px;">
                    <button id="back-to-step-2" class="btn-secondary" style="flex: 1; min-width: 80px;">Back</button>
                    <button id="test-extraction" class="btn-secondary" style="flex: 1; min-width: 100px;">
                        <span id="test-text">Dry Run</span>
                        <div id="test-spinner" class="spinner-small hidden"></div>
                    </button>
                    <button id="submit-request" class="btn-primary" style="flex: 2; min-width: 150px;">
                        <span id="submit-text">Send to JDownloader</span>
                        <div id="submit-spinner" class="spinner-small hidden"></div>
                    </button>
                </div>
                
                <!-- Container for Dry Run Results -->
                <div id="dry-run-results" class="hidden" style="margin-top: 15px; max-height: 200px; overflow-y: auto; text-align: left; background: var(--bg-tertiary); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <h4 style="margin: 0 0 10px 0; font-size: 14px; color: var(--text-primary);">Extracted Links:</h4>
                    <ul id="dry-run-list" style="list-style: none; padding: 0; margin: 0; font-size: 12px; color: var(--text-secondary); word-break: break-all; display: flex; flex-direction: column; gap: 6px;">
                    </ul>
                </div>
            </div>
            
            <div id="modal-status" class="status-text hidden" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
